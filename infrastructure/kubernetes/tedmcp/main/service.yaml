apiVersion: v1
kind: Service
metadata:
  name: tedmcp-svc
  namespace: tedmcp
spec:
  type: ClusterIP
  selector:
    app: tedmcp
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tedmcp-cache
  namespace: tedmcp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# The team's saved searches, shortlist and term packs. Small, but not
# regenerable like the cache: back it up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tedmcp-data
  namespace: tedmcp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
