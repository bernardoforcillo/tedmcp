# 1. ImageRepository — tells Flux which registry to scan.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: tedmcp-image-repository
  namespace: tedmcp
spec:
  image: bernardoforcillo/tedmcp
  interval: 1m
---
# 2. ImagePolicy — selects the newest stable tag (<YYYYMMDDHHMMSS>-<sha>).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: tedmcp-image-policy
  namespace: tedmcp
spec:
  imageRepositoryRef:
    name: tedmcp-image-repository
  filterTags:
    # Stable tags from main are <YYYYMMDDHHMMSS>-<full-sha>.
    pattern: "^(?P<timestamp>[0-9]{14})-[0-9a-fA-F]{40}$"
    extract: "$timestamp"
  policy:
    numerical:
      order: asc
  digestReflectionPolicy: Always
  interval: 1m
---
# 3. ImageUpdateAutomation — rewrites the $imagepolicy marker in deployment.yaml
#    and commits back to main so Flux reconciles the updated manifest.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: image-automation-tedmcp
  namespace: tedmcp
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: autoted-repository
    namespace: flux-system
  git:
    commit:
      author:
        name: Bernardo Forcillo
        email: me@bernardoforcillo.com
      messageTemplate: "chore: update image tedmcp"
    push:
      branch: main
  update:
    path: "./infrastructure/kubernetes/tedmcp"
    strategy: Setters
